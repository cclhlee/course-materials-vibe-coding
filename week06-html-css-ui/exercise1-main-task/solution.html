<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>從線框圖到成品：用Replit Agent生成健康量表頁面（解答）</title>
<style>body{font-family:sans-serif;max-width:640px;margin:40px auto;line-height:1.6;padding:0 16px;}</style>
</head>
<body>
<h1>今日健康量表</h1>

<fieldset>
  <legend>今日情緒</legend>
  <label for="moodGood"><input type="radio" id="moodGood" name="mood" value="good"> 很好</label>
  <label for="moodOk"><input type="radio" id="moodOk" name="mood" value="ok"> 普通</label>
  <label for="moodBad"><input type="radio" id="moodBad" name="mood" value="bad"> 不佳</label>
</fieldset>

<label for="symptoms">其他症狀描述</label>
<textarea id="symptoms" name="symptoms" rows="4"></textarea>

<button type="submit">送出</button>
</body>
</html>
